
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Certificate Verification</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 25px 12px;
  color: #172033;
}

.card {
  max-width: 600px;
  margin: 20px auto;
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 4px 18px #00000015;
}

.header {
  text-align: center;
  border-bottom: 2px solid #123b68;
  padding-bottom: 15px;
}

.logo {
  font-size: 34px;
}

h1 {
  font-size: 24px;
  color: #123b68;
  margin: 10px 0;
}

.subtitle {
  color: #64748b;
  margin: 0;
}

input, button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 7px;
  font-size: 16px;
}

input {
  border: 1px solid #cbd5e1;
}

button {
  background: #123b68;
  color: white;
  border: 0;
  cursor: pointer;
}

#result {
  margin-top: 24px;
}

.status {
  text-align: center;
  font-weight: bold;
  padding: 12px;
  background: #e8f7ed;
  color: #18733a;
  border-radius: 7px;
}

.expired {
  background: #fff0f0;
  color: #b42318;
}

.field {
  padding: 11px 0;
  border-bottom: 1px solid #e5e7eb;
  overflow-wrap: anywhere;
}

.label {
  font-weight: bold;
  color: #123b68;
}

.footer {
  text-align: center;
  color: #64748b;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<main class="card">

  <div class="header">
    <div class="logo">🪪</div>
    <h1>Worker Certificate Verification</h1>
    <p class="subtitle">
      Verify Worker Certificate Online
    </p>
  </div>

  <form id="verifyForm">
    <input
      id="workerId"
      type="text"
      placeholder="Enter Worker ID"
      autocomplete="off"
      required
    >
    <button type="submit">
      Verify Certificate
    </button>
  </form>

  <div id="result" aria-live="polite"></div>

  <div class="footer">
    Online Certificate Verification System
  </div>

</main>

<script>
const workers = {
  "DEMO001": {
    id: "DEMO001",
    name: "Demo Worker",
    position: "Scaffolding Erector",
    certificateNo: "CERT-2026-001",
    company: "Your Company Name",
    trainer: "Demo Trainer",
    location: "Jubail, Saudi Arabia",
    issueDate: "2026-08-02",
    expiryDate: "2027-08-01"
  }
};

const form = document.getElementById("verifyForm");
const input = document.getElementById("workerId");
const result = document.getElementById("result");

function showWorker(workerId) {
  const id = workerId.trim().toUpperCase();
  const worker = workers[id];

  result.replaceChildren();

  if (!worker) {
    const message = document.createElement("p");
    message.className = "status expired";
    message.textContent =
      "Certificate Not Found. Please check Worker ID.";
    result.appendChild(message);
    return;
  }

  const today = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Riyadh",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());

  const isExpired = worker.expiryDate < today;

  const heading = document.createElement("h2");
  heading.textContent = isExpired
    ? "Certificate Expired"
    : "Certificate Verified";
  result.appendChild(heading);

  const status = document.createElement("div");
  status.className = isExpired
    ? "status expired"
    : "status";
  status.textContent = "Status: " +
    (isExpired ? "EXPIRED" : "VALID");
  result.appendChild(status);

  const fields = [
    ["Worker ID", worker.id],
    ["Worker Name", worker.name],
    ["Position", worker.position],
    ["Certificate No.", worker.certificateNo],
    ["Company Name", worker.company],
    ["Trainer", worker.trainer],
    ["Location", worker.location],
    ["Issue Date", worker.issueDate],
    ["Expiry Date", worker.expiryDate]
  ];

  fields.forEach(function(field) {
    const row = document.createElement("div");
    row.className = "field";

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = field[0] + ": ";

    const value = document.createElement("span");
    value.textContent = field[1] || "N/A";

    row.append(label, value);
    result.appendChild(row);
  });
}

form.addEventListener("submit", function(event) {
  event.preventDefault();
  showWorker(input.value);
});

const params = new URLSearchParams(window.location.search);

const qrId =
  params.get("id") ||
  params.get("workerId") ||
  params.get("cert");

if (qrId) {
  input.value = qrId;
  showWorker(qrId);
}
</script>

</body>
</html>
